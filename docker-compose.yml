services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    networks:
      - qualital

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN:?Defina API_DOMAIN no arquivo .env da VPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - qualital

networks:
  qualital:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: